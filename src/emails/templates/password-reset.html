<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>set a new password</title>
</head>
<body style="margin:0; padding:0; background-color:#FCFCFC; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FCFCFC;">
  <tr>
    <td align="center" style="padding: 48px 24px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">

        <tr>
          <td align="center" style="padding-bottom: 28px;">
            <img src="{{logo_url}}" width="120" alt="Flower Children World" style="display:block;">
          </td>
        </tr>

        <tr>
          <td style="background-color:#F4F7DC; border-radius:28px; padding: 36px 32px 32px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding-bottom: 10px;">
                  <span style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#1f6b12; font-weight:700;">{{eyebrow}}</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 14px;">
                  <span style="font-size:28px; line-height:1.25; color:#020202; font-weight:700;">{{headline}}</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 28px;">
                  <span style="font-size:15px; line-height:1.7; color:#444444;">{{body}}</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 18px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td align="center" style="background-color:#3AB819; border-radius:999px;">
                        <a href="{{reset_url}}" target="_blank" style="display:block; padding:14px 28px; font-size:15px; font-weight:600; color:#FCFCFC; text-decoration:none;">
                          {{button_label}}
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td>
                  <span style="font-size:13px; line-height:1.6; color:#1f6b12;">{{note}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
