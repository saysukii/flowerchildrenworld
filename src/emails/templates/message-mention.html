<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{sender_name}} mentioned you</title>
</head>
<body style="margin:0; padding:0; background-color:#FCFCFC; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FCFCFC;">
  <tr>
    <td align="center" style="padding: 48px 24px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">

        <tr>
          <td align="center" style="padding-bottom: 40px;">
            <img src="{{logo_url}}" width="120" alt="Flower Children World" style="display:block;">
          </td>
        </tr>

        <tr>
          <td style="background-color:#FFFFFF; border:1px solid #ECECEC; border-radius:12px; padding: 40px 36px;">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding-bottom: 4px;">
                  <span style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#3AB819; font-weight:700;">INSIDE</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 20px; padding-top: 6px;">
                  <span style="font-size:24px; line-height:1.3; color:#020202; font-weight:700;">{{sender_name}} mentioned you.</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 28px;">
                  <span style="font-size:15px; line-height:1.6; color:#444444;">
                    {{recipient_name}}, this was left for you in team messages.
                  </span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background-color:#F7F8EE; border-radius:12px; padding: 18px 20px;">
                        <span style="font-size:15px; line-height:1.6; color:#020202;">{{message_body}}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom: 8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background-color:#020202; border-radius:8px;">
                        <a href="{{messages_url}}" target="_blank" style="display:inline-block; padding:14px 28px; font-size:15px; font-weight:600; color:#FCFCFC; text-decoration:none; border-radius:8px;">
                          Open the message →
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top: 28px;">
            <span style="font-size:12px; color:#AAAAAA;">Flower Children World</span>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
